<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Terch VPN</title>
    <script src="https://telegram.org/js/telegram-web-app.js?56"></script>
    <style id="theme-styles">
        /* Базовые переменные (темная тема по умолчанию) */
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --border: #334155;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-grad: linear-gradient(135deg, #38bdf8, #818cf8);
            --btn-bg: #0f172a;
            --btn-border: #334155;
            --shadow: 0 20px 60px rgba(0,0,0,0.6);
            --badge-active: #22c55e22;
            --badge-active-text: #4ade80;
            --badge-active-border: #4ade80;
            --badge-expired: #ef444422;
            --badge-expired-text: #f87171;
            --badge-expired-border: #f87171;
        }

        /* Светлая тема */
        [data-theme="light"] {
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --border: #cbd5e1;
            --text: #0f172a;
            --text-muted: #475569;
            --accent: #2563eb;
            --accent-grad: linear-gradient(135deg, #2563eb, #7c3aed);
            --btn-bg: #f8fafc;
            --btn-border: #cbd5e1;
            --shadow: 0 20px 60px rgba(0,0,0,0.08);
            --badge-active: #dcfce7;
            --badge-active-text: #166534;
            --badge-active-border: #22c55e;
            --badge-expired: #fee2e2;
            --badge-expired-text: #991b1b;
            --badge-expired-border: #ef4444;
        }

        /* Синяя тема */
        [data-theme="blue"] {
            --bg: #0c1a2e;
            --card-bg: #1a2a4a;
            --border: #2a4a7a;
            --text: #dbeafe;
            --text-muted: #93b4e8;
            --accent: #60a5fa;
            --accent-grad: linear-gradient(135deg, #60a5fa, #a78bfa);
            --btn-bg: #0c1a2e;
            --btn-border: #2a4a7a;
            --shadow: 0 20px 60px rgba(0,20,80,0.6);
        }

        /* Зеленая тема */
        [data-theme="green"] {
            --bg: #0a1f1a;
            --card-bg: #14352a;
            --border: #2a5a45;
            --text: #d1fae5;
            --text-muted: #86c8b0;
            --accent: #34d399;
            --accent-grad: linear-gradient(135deg, #34d399, #6ee7b7);
            --btn-bg: #0a1f1a;
            --btn-border: #2a5a45;
            --shadow: 0 20px 60px rgba(0,40,20,0.6);
        }

        /* Фиолетовая тема */
        [data-theme="purple"] {
            --bg: #1a0a2e;
            --card-bg: #2a1a4a;
            --border: #4a2a7a;
            --text: #ede9fe;
            --text-muted: #b8a5e8;
            --accent: #a78bfa;
            --accent-grad: linear-gradient(135deg, #a78bfa, #c084fc);
            --btn-bg: #1a0a2e;
            --btn-border: #4a2a7a;
            --shadow: 0 20px 60px rgba(40,0,80,0.6);
        }

        /* Оранжевая тема */
        [data-theme="orange"] {
            --bg: #1f120a;
            --card-bg: #3a2215;
            --border: #6a3d25;
            --text: #fef3c7;
            --text-muted: #d9a87e;
            --accent: #fb923c;
            --accent-grad: linear-gradient(135deg, #fb923c, #facc15);
            --btn-bg: #1f120a;
            --btn-border: #6a3d25;
            --shadow: 0 20px 60px rgba(60,30,0,0.6);
        }

        /* Общие стили */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 16px 12px 30px;
            transition: background 0.2s, color 0.2s;
        }
        .header {
            text-align: center;
            padding: 12px 0 16px;
        }
        .header h1 {
            font-size: 26px;
            font-weight: 700;
            background: var(--accent-grad);
            -webkit-background-clip: text;
            background-clip: text; /* добавлено для совместимости */
            -webkit-text-fill-color: transparent;
        }
        .header p {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 2px;
        }
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px 18px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            transition: background 0.2s, border 0.2s;
        }
        .card .label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .card .value {
            font-size: 18px;
            font-weight: 600;
            color: var(--text);
            margin-top: 2px;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }
        .status-badge.active {
            background: var(--badge-active);
            color: var(--badge-active-text);
            border: 1px solid var(--badge-active-border);
        }
        .status-badge.expired {
            background: var(--badge-expired);
            color: var(--badge-expired-text);
            border: 1px solid var(--badge-expired-border);
        }
        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 8px;
        }
        .menu-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--btn-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 18px;
            color: var(--text);
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s, border 0.15s;
            text-decoration: none;
        }
        .menu-btn:active { opacity: 0.7; }
        .menu-btn .icon { font-size: 20px; margin-right: 12px; }
        .menu-btn .arrow { color: var(--text-muted); font-size: 14px; }
        .menu-btn.admin { border-color: #8b5cf6; background: rgba(139, 92, 246, 0.15); }
        .divider {
            border-top: 1px solid var(--border);
            margin: 12px 0;
        }
        .footer {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 20px;
        }
        .hidden { display: none; }

        /* Ключи */
        .key-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .key-btn {
            flex: 1;
            background: var(--btn-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
            cursor: pointer;
            transition: 0.15s;
        }
        .key-btn:active { opacity: 0.7; }
        .key-btn.lite { border-color: #3b82f6; }
        .key-btn.universal { border-color: #f59e0b; }
        .key-link {
            color: var(--accent);
            word-break: break-all;
            font-size: 13px;
            display: block;
            margin-top: 6px;
        }
        .copy-btn {
            background: var(--accent);
            border: none;
            color: #fff;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            margin-top: 6px;
            transition: 0.15s;
        }
        .copy-btn:active { opacity: 0.7; }
        .key-display-box {
            background: var(--btn-bg);
            padding: 10px;
            border-radius: 10px;
            border: 1px solid var(--border);
            margin-top: 6px;
        }

        /* Выбор темы */
        .theme-selector {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 8px 0 4px;
        }
        .theme-dot {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid var(--border);
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .theme-dot.active {
            border-color: var(--accent);
            transform: scale(1.15);
        }
        .theme-dot.dark { background: #0f172a; }
        .theme-dot.light { background: #f1f5f9; border-color: #cbd5e1; }
        .theme-dot.blue { background: #0c1a2e; }
        .theme-dot.green { background: #0a1f1a; }
        .theme-dot.purple { background: #1a0a2e; }
        .theme-dot.orange { background: #1f120a; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🌊 Terch VPN</h1>
        <p>Быстрее горной реки</p>
    </div>

    <!-- Карточка профиля -->
    <div class="card">
        <div class="label">Ваш Telegram ID</div>
        <div class="value" id="userId">—</div>
        <div style="margin-top:10px;">
            <span class="label">Статус подписки</span>
            <div style="margin-top:4px;">
                <span class="status-badge" id="statusBadge">Загрузка…</span>
                <span style="margin-left:8px;font-size:14px;color:var(--text-muted);" id="expiryText"></span>
            </div>
        </div>
    </div>

    <!-- Выбор темы -->
    <div class="card" style="padding:12px 16px;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
            <span class="label">🎨 Тема</span>
            <span style="font-size:12px;color:var(--text-muted);">(сохраняется)</span>
        </div>
        <div class="theme-selector" id="themeSelector">
            <div class="theme-dot dark active" data-theme="dark" title="Тёмная"></div>
            <div class="theme-dot light" data-theme="light" title="Светлая"></div>
            <div class="theme-dot blue" data-theme="blue" title="Синяя"></div>
            <div class="theme-dot green" data-theme="green" title="Зелёная"></div>
            <div class="theme-dot purple" data-theme="purple" title="Фиолетовая"></div>
            <div class="theme-dot orange" data-theme="orange" title="Оранжевая"></div>
        </div>
    </div>

    <!-- Меню -->
    <div class="menu-grid">

        <!-- Настроить VPN -->
        <div class="menu-btn" id="btnSetup">
            <span><span class="icon">⚙️</span> Настроить VPN</span>
            <span class="arrow">→</span>
        </div>

        <!-- Ключи доступа (разворачивается) -->
        <div class="menu-btn" id="btnKeys">
            <span><span class="icon">🔑</span> Ключ доступа</span>
            <span class="arrow">▼</span>
        </div>
        <div id="keysSubmenu" class="hidden" style="padding:0 6px 6px;">
            <div class="key-row">
                <div class="key-btn lite" id="keyLite">📦 LITE</div>
                <div class="key-btn universal" id="keyUniversal">💎 UNIVERSAL</div>
            </div>
            <div id="keyDisplay" style="margin-top:8px;"></div>
        </div>

        <!-- Помощь -->
        <div class="menu-btn" id="btnHelp">
            <span><span class="icon">ℹ️</span> Помощь</span>
            <span class="arrow">→</span>
        </div>

        <!-- Новости и акции -->
        <a class="menu-btn" id="btnNews" href="#" target="_blank">
            <span><span class="icon">📢</span> Новости и акции ↗️</span>
            <span class="arrow">→</span>
        </a>

        <!-- Админка (только для админа) -->
        <div class="menu-btn admin hidden" id="btnAdmin">
            <span><span class="icon">👑</span> Административная панель</span>
            <span class="arrow">→</span>
        </div>

    </div>

    <div class="footer">© 2026 Terch VPN · Все права защищены</div>

    <script>
        // === Инициализация Telegram Web App ===
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // === Данные пользователя ===
        const user = tg.initDataUnsafe?.user;
        const userId = user ? user.id : null;

        // ⚠️ ЗАМЕНИ НА СВОЙ ADMIN_ID
        const ADMIN_ID = 7121553631;
        const isAdmin = (userId === ADMIN_ID);

        // === DOM ===
        const userIdEl = document.getElementById('userId');
        const statusBadge = document.getElementById('statusBadge');
        const expiryText = document.getElementById('expiryText');
        const keysSubmenu = document.getElementById('keysSubmenu');
        const keyDisplay = document.getElementById('keyDisplay');
        const btnAdmin = document.getElementById('btnAdmin');
        const themeDots = document.querySelectorAll('.theme-dot');
        const root = document.documentElement;

        // === Отображение ID ===
        if (userId) {
            userIdEl.textContent = userId;
        } else {
            userIdEl.textContent = 'Не определен (откройте через бота)';
        }

        // === Показываем админку, если админ ===
        if (isAdmin) {
            btnAdmin.classList.remove('hidden');
        }

        // === Загрузка сохранённой темы ===
        const savedTheme = localStorage.getItem('terch-theme') || 'dark';
        setTheme(savedTheme);

        /**
         * Устанавливает тему оформления
         * @param {string} theme - название темы (dark, light, blue, green, purple, orange)
         */
        function setTheme(theme) {
            root.setAttribute('data-theme', theme);
            themeDots.forEach(function(dot) {
                dot.classList.toggle('active', dot.dataset.theme === theme);
            });
            localStorage.setItem('terch-theme', theme);
        }

        // Обработчики выбора темы
        themeDots.forEach(function(dot) {
            dot.addEventListener('click', function() {
                setTheme(dot.dataset.theme);
            });
        });

        // === Заглушка статуса (позже заменим на реальный API) ===
        function updateStatus() {
            // Демо-статус
            statusBadge.textContent = '🟢 Активен';
            statusBadge.className = 'status-badge active';
            expiryText.textContent = 'до 31.12.2026 (демо)';
        }
        if (userId) updateStatus();

        // === Обработка кнопок ===

        // 1. Настроить VPN
        document.getElementById('btnSetup').addEventListener('click', function() {
            tg.sendData('setup_step1');
            tg.close();
        });

        // 2. Ключи – разворачиваем/сворачиваем подменю
        document.getElementById('btnKeys').addEventListener('click', function() {
            const isHidden = keysSubmenu.classList.contains('hidden');
            keysSubmenu.classList.toggle('hidden');
            document.querySelector('#btnKeys .arrow').textContent = isHidden ? '▲' : '▼';
        });

        // 2a. LITE ключ
        document.getElementById('keyLite').addEventListener('click', function() {
            if (!userId) return;
            const link = 'https://raw.githubusercontent.com/zieng2/wl/main/vless_lite.txt?user=' + userId;
            showKey('📦 LITE ключ', link);
        });

        // 2b. UNIVERSAL ключ
        document.getElementById('keyUniversal').addEventListener('click', function() {
            if (!userId) return;
            const link = 'https://raw.githubusercontent.com/zieng2/wl/main/vless_universal.txt?user=' + userId;
            showKey('💎 UNIVERSAL ключ', link);
        });

        /**
         * Показывает ключ в блоке keyDisplay
         * @param {string} label - название ключа
         * @param {string} link - ссылка на ключ
         */
        function showKey(label, link) {
            var escaped = link.replace(/'/g, "\\'");
            keyDisplay.innerHTML =
                '<div class="key-display-box">' +
                '<span style="color:var(--text-muted);font-size:13px;">' + label + '</span>' +
                '<a href="' + link + '" target="_blank" class="key-link">' + link + '</a>' +
                '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;">' +
                '<button class="copy-btn" onclick="navigator.clipboard.writeText(\'' + escaped + '\')">📋 Копировать</button>' +
                '<button class="copy-btn" style="background:var(--accent);" onclick="location.href=\'happ://import?url=' + encodeURIComponent(link) + '\'">🚀 Открыть в Happ</button>' +
                '</div></div>';
        }

        // 3. Помощь
        document.getElementById('btnHelp').addEventListener('click', function() {
            tg.sendData('open_help');
            tg.close();
        });

        // 4. Новости – ссылка на канал (замени на свой)
        document.getElementById('btnNews').href = 'https://t.me/TerchVPN';

        // 5. Админка
        document.getElementById('btnAdmin').addEventListener('click', function() {
            tg.sendData('open_admin_panel');
            tg.close();
        });

        console.log('Terch VPN Web App готов');
    </script>
</body>
</html>
